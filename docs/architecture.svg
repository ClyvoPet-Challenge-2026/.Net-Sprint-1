<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 650" role="img" aria-labelledby="title description">
  <title id="title">Arquitetura da API .NET ClyvoCare</title>
  <desc id="description">A API usa serviços da Application e registra implementações da Infrastructure. Application e Infrastructure dependem de Domain. Os repositórios acessam Oracle FIAP e MongoDB Atlas. Logs, health checks, métricas e tracing acompanham a execução.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#345b7b"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#21384c} .heading{font-size:22px;font-weight:700}.body{font-size:17px}.small{font-size:15px}.box{fill:#f3f7fb;stroke:#9fb8cd;stroke-width:1.5}.arrow{fill:none;stroke:#345b7b;stroke-width:2;marker-end:url(#arrow)}.label{font-size:14px;paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round}</style>
  </defs>
  <rect width="1080" height="650" fill="white"/>
  <text x="30" y="34" class="heading">ClyvoCare · ASP.NET Core / .NET 9</text>
  <text x="30" y="62" class="small">Setas entre projetos representam dependências de código; a composição das implementações acontece na API.</text>
  <rect x="30" y="115" width="240" height="155" rx="12" class="box"/>
  <text x="150" y="146" text-anchor="middle" class="heading">API</text>
  <text x="150" y="178" text-anchor="middle" class="body">Controllers / Swagger</text>
  <text x="150" y="207" text-anchor="middle" class="body">JWT / validação / erros</text>
  <text x="150" y="237" text-anchor="middle" class="small">Program: injeção de dependência</text>
  <text x="150" y="96" text-anchor="middle" class="small">Mobile / Swagger → HTTPS</text>
  <path d="M150,99 V111" class="arrow"/>
  <rect x="385" y="115" width="270" height="155" rx="12" class="box"/>
  <text x="520" y="146" text-anchor="middle" class="heading">Application</text>
  <text x="520" y="178" text-anchor="middle" class="body">Serviços e casos de uso</text>
  <text x="520" y="207" text-anchor="middle" class="body">DTOs / interfaces</text>
  <text x="520" y="237" text-anchor="middle" class="small">Contratos dos repositórios</text>
  <rect x="770" y="115" width="280" height="155" rx="12" class="box"/>
  <text x="910" y="146" text-anchor="middle" class="heading">Infrastructure</text>
  <text x="910" y="178" text-anchor="middle" class="body">Repository / EF Core</text>
  <text x="910" y="207" text-anchor="middle" class="body">Oracle + driver MongoDB</text>
  <text x="910" y="237" text-anchor="middle" class="small">Persistência e auditoria</text>
  <path d="M270,186 H380" class="arrow"/><text x="327" y="169" text-anchor="middle" class="label">Usa serviços</text>
  <path d="M770,218 H660" class="arrow"/><text x="714" y="199" text-anchor="middle" class="label">Implementa interfaces</text>
  <path d="M150,270 V304 H915 V274" class="arrow" stroke-dasharray="6 4"/>
  <text x="526" y="299" text-anchor="middle" class="label">API registra os repositórios concretos na composição da aplicação</text>
  <rect x="385" y="365" width="270" height="124" rx="12" fill="#eef8f3" stroke="#83b59d" stroke-width="1.5"/>
  <text x="520" y="398" text-anchor="middle" class="heading">Domain</text>
  <text x="520" y="429" text-anchor="middle" class="body">Entidades / invariantes</text>
  <text x="520" y="461" text-anchor="middle" class="small">Sem referência a API ou bancos</text>
  <path d="M520,270 V360" class="arrow"/>
  <path d="M1027,270 V340 H635 V360" class="arrow"/>
  <rect x="770" y="365" width="280" height="124" rx="12" fill="#fff7ec" stroke="#c9ab7e" stroke-width="1.5"/>
  <text x="910" y="398" text-anchor="middle" class="heading">Bancos remotos</text>
  <text x="910" y="429" text-anchor="middle" class="body">Oracle FIAP: dados de negócio</text>
  <text x="910" y="461" text-anchor="middle" class="body">Atlas: auditoria de clínicas</text>
  <path d="M800,270 V360" class="arrow"/><text x="843" y="333" class="label">Acesso aos dados</text>
  <rect x="30" y="535" width="1020" height="90" rx="12" fill="#edf4fa" stroke="#9fb8cd"/>
  <text x="52" y="567" class="heading">Observabilidade</text>
  <text x="52" y="596" class="body">Serilog + TraceId · Health Oracle/Atlas · /metrics · OpenTelemetry: API → Application → Infrastructure</text>
  <text x="30" y="512" class="small">A Java emite o JWT; a .NET verifica a pública RSA e a conta no Oracle compartilhado, sem chamada HTTP à Java.</text>
</svg>
